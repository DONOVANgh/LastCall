
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Art Source</title>
  <style>
    :root {
      --color-text-secondary: #9bb0a8;
      --font-mono: "Consolas", "Courier New", monospace;
    }

    @keyframes alienFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    @keyframes ufoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes eyeGlow {
      0%, 30%, 100% { opacity: 1; }
      45%, 55% { opacity: 0.05; }
    }

    @keyframes eyePulse {
      0%, 100% { fill: #ff2200; }
      50% { fill: #ff6600; }
    }

    @keyframes ufoBeam {
      0%, 100% { opacity: 0.8; transform: scaleX(1); }
      50% { opacity: 0.35; transform: scaleX(0.82); }
    }

    @keyframes ufoLight {
      0%, 100% { opacity: 1; }
      33% { opacity: 0.15; }
      66% { opacity: 0.75; }
    }

    @keyframes spark {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes domeShimmer {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes veinPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes smileBlink {
      0%, 85%, 100% { opacity: 1; }
      90%, 95% { opacity: 0; }
    }

    @keyframes jawClench {
      0%, 100% { transform: translateY(0px); }
      20%, 60% { transform: translateY(1px); }
      40%, 80% { transform: translateY(-1px); }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #143225 0%, #0b1512 55%, #050706 100%);
      color: #d6e6de;
    }

    .scene {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 50px;
      padding: 40px 10px 20px;
      min-height: 340px;
      background: transparent;
    }

    .alien-wrap {
      animation: alienFloat 3.2s ease-in-out infinite;
      display: inline-block;
    }

    .ufo-wrap {
      animation: ufoFloat 2.6s ease-in-out infinite;
      display: inline-block;
      animation-delay: 0.4s;
    }

    .eye-blink { animation: eyeGlow 2.8s ease-in-out infinite; }
    .eye-color { animation: eyePulse 1.4s ease-in-out infinite; }
    .ufo-beam {
      animation: ufoBeam 2.6s ease-in-out infinite;
      transform-origin: top center;
      animation-delay: 0.4s;
    }

    .light1 { animation: ufoLight 1.1s ease-in-out infinite; }
    .light2 { animation: ufoLight 1.1s ease-in-out infinite; animation-delay: 0.37s; }
    .light3 { animation: ufoLight 1.1s ease-in-out infinite; animation-delay: 0.74s; }
    .light4 { animation: ufoLight 1.1s ease-in-out infinite; animation-delay: 0.18s; }
    .light5 { animation: ufoLight 1.1s ease-in-out infinite; animation-delay: 0.55s; }
    .spark1 { animation: spark 1.6s ease-in-out infinite; }
    .spark2 { animation: spark 1.6s ease-in-out infinite; animation-delay: 0.53s; }
    .spark3 { animation: spark 1.6s ease-in-out infinite; animation-delay: 1.07s; }
    .dome-shine { animation: domeShimmer 2s ease-in-out infinite; }
    .vein { animation: veinPulse 1.6s ease-in-out infinite; }
    .smile-face { animation: smileBlink 3s ease-in-out infinite; }
    .jaw { animation: jawClench 2.4s ease-in-out infinite; }

    .label {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: 8px;
      letter-spacing: 1px;
    }
  </style>
</head>
